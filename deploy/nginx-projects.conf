# =============================================================================
# projects - 个人站上的两个独立项目（各自一个子域名）
#
#   https://frost.studentop.cn:14355/  → 反代到 127.0.0.1:4173（北湖霜降雅集，Node 24 + SQLite，systemd: frost-atlas.service）
#   https://liyun.studentop.cn:14355/  → 静态站 /opt/projects/liyun/current（理韵寻踪 HUD，Vite 构建产物）
#
# 公网链路：浏览器 → DNS(CNAME → cn-bj1-kvlqs4ee.frp.cool) → 浮居北京1号 :14355
#          → frpc（树莓派 [Raspiberry] type=tcp）→ 127.0.0.1:443（本 nginx，按 SNI 分流）
#
# 监听地址必须保持 127.0.0.1（与主站一致，只经 frp 隧道对外）。
# 证书复用主站那张 Let's Encrypt 证书（SAN 含 studentop.cn / www / frost / liyun）。
# =============================================================================

# ---------- 北湖霜降雅集（Node 应用） ----------
server {
    listen 127.0.0.1:443 ssl;
    http2 on;
    server_name frost.studentop.cn;

    access_log /var/log/nginx/projects-frost.access.log;
    error_log  /var/log/nginx/projects-frost.error.log warn;

    ssl_certificate     /opt/win11-home/certs/studentop.cn.crt;
    ssl_certificate_key /opt/win11-home/certs/studentop.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 应用自身会返回 CSP / X-Frame-Options 等安全头，这里不再重复添加
    # 应用内单张照片上限 5MiB，留一点余量；超过 8MB 的直接在 nginx 层拒掉
    client_max_body_size 8m;
    client_body_timeout  90s;

    # 管理端与 /api/admin 不对外（应用自身也会 404，这里双保险）
    location ~ ^/(?:admin|api/admin)(?:/|$) { return 404; }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;

        # Host 需要保留 :14355，应用按 FROST_PUBLIC_ORIGIN 严格校验 Host
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 应用只接受单个精确 IP（request-policy 会校验），不要拼成链
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 照片上传直接流式转发，别让 nginx 先落盘
        proxy_request_buffering off;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_connect_timeout 10s;
    }
}

# ---------- 理韵寻踪（静态站） ----------
server {
    listen 127.0.0.1:443 ssl;
    http2 on;
    server_name liyun.studentop.cn;

    access_log /var/log/nginx/projects-liyun.access.log;
    error_log  /var/log/nginx/projects-liyun.error.log warn;

    ssl_certificate     /opt/win11-home/certs/studentop.cn.crt;
    ssl_certificate_key /opt/win11-home/certs/studentop.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/projects/liyun/current;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml application/manifest+json application/wasm;

    # 入口页不缓存，保证重新发布立即可见
    location = /index.html { expires -1; }

    # .opus 不在默认 mime.types 里，单独给一个正确类型（前端有 mp3 降级，但类型干净更好）
    location ~* \.opus$ {
        default_type audio/ogg;
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # 构建产物按名缓存
    location ~* \.(?:js|css|mjs|json|webp|avif|png|jpe?g|gif|svg|ico|woff2?|ttf|otf|mp3|m4a|ogg|wav|mp4|webm|wasm)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location ~ /\.(?!well-known/) { deny all; }

    # 没有客户端路由（单页无 history 路由），不需要 SPA fallback
    location / {
        try_files $uri $uri/ =404;
    }
}

# ---------- 原神启动（3D 开场动画，开门后白光过场 → 跳转理韵寻踪） ----------
server {
    listen 127.0.0.1:443 ssl;
    http2 on;
    server_name genshin.studentop.cn;

    access_log /var/log/nginx/projects-genshin.access.log;
    error_log  /var/log/nginx/projects-genshin.error.log warn;

    ssl_certificate     /opt/win11-home/certs/studentop.cn.crt;
    ssl_certificate_key /opt/win11-home/certs/studentop.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/projects/genshin/current;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml application/wasm model/gltf-binary;

    # 入口页不缓存
    location = /index.html { expires -1; }

    # 3D 模型 / 贴图 / 音频：长缓存（构建产物文件名带哈希，public 资源基本不变）
    location ~* \.(?:glb|gltf|bin|png|jpe?g|webp|avif|svg|ico|mp3|ogg|wav|woff2?|ttf|otf|wasm|ani)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\.(?!well-known/) { deny all; }
}
