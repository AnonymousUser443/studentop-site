# Music stays behind the existing desktop gate. The SDK listener is never public.
location = /__desktop/music { return 404; }
location = /__desktop/music/v1 { return 404; }
location ^~ /__desktop/music/v1/ {
    proxy_pass http://127.0.0.1:8900;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Origin $http_origin;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header X-Desktop-CSRF $http_x_desktop_csrf;
    proxy_set_header X-Music-Playback-CSRF $http_x_music_playback_csrf;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";
    client_max_body_size 32k;
    client_body_timeout 15s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 45s;
    proxy_send_timeout 15s;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_intercept_errors off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store, private" always;
    include /etc/nginx/snippets/win11-home-headers.conf;
    access_log off;
}
