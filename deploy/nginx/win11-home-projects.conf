# Same-domain static applications. No new DNS, certificates, ports or upstream service.
# Hashed asset stores are append-only across releases, so open older tabs keep working.
location = /voxel-campus { return 308 /voxel-campus/$is_args$args; }
location = /campus-entry { return 308 /campus-entry/$is_args$args; }
location = /liyun-moyuan { return 308 /liyun-moyuan/$is_args$args; }
location = /voxel-campus/index.html {
    alias /opt/projects/voxel-campus/current/index.html;
    expires -1; etag off; if_modified_since off;
}
location = /campus-entry/index.html {
    alias /opt/projects/campus-entry/current/index.html;
    expires -1; etag off; if_modified_since off;
}
location = /liyun-moyuan/index.html {
    alias /opt/projects/liyun-moyuan/current/index.html;
    expires -1; etag off; if_modified_since off;
}
location ^~ /voxel-campus/assets/ {
    alias /opt/projects/voxel-campus/shared-assets/;
    include /etc/nginx/mime.types;
    types { audio/ogg opus; }
    expires -1;
    if ($uri ~ /\.) { return 404; }
}
location ^~ /campus-entry/assets/ {
    alias /opt/projects/campus-entry/shared-assets/;
    expires -1;
    if ($uri ~ /\.) { return 404; }
}
location ^~ /liyun-moyuan/assets/ {
    alias /opt/projects/liyun-moyuan/shared-assets/;
    expires -1;
    if ($uri ~ /\.) { return 404; }
}
location ^~ /voxel-campus/ {
    alias /opt/projects/voxel-campus/current/;
    try_files $uri $uri/ =404;
    expires -1;
    if ($uri ~ /\.) { return 404; }
}
location ^~ /campus-entry/ {
    alias /opt/projects/campus-entry/current/;
    try_files $uri $uri/ =404;
    expires -1;
    if ($uri ~ /\.) { return 404; }
}
location ^~ /liyun-moyuan/ {
    alias /opt/projects/liyun-moyuan/current/;
    try_files $uri $uri/ =404;
    expires -1;
    if ($uri ~ /\.) { return 404; }
}

# BEGIN ZHUIGUANG
# Zhuiguangzhe uses a path-scoped Service Worker and Socket.IO endpoint.
location = /zhuiguang { return 308 /zhuiguang/$is_args$args; }
location ^~ /zhuiguang/ {
    proxy_pass http://127.0.0.1:4188;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 90s;
    proxy_buffering off;
    client_max_body_size 64k;
}
# END ZHUIGUANG
