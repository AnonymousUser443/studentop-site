<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e9eef5" />
  <meta name="description" content="原神启动 · 保留原版天空、柱路与开门动画的独立本地恢复入口。非官方学习演示；公开再分发许可尚待审核。" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self' blob: ws://127.0.0.1:8081 ws://localhost:8081; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <link rel="icon" href="/logo.ico" />
  <title>原神启动 · 原版独立入口</title>
  <style>
    html,body{margin:0;background:#fff;color:#333;font-family:'Noto Sans SC','HarmonyOS Sans SC',sans-serif}*{box-sizing:border-box}[hidden]{display:none!important}
    .legacy-toolbar{position:fixed;top:20px;left:4%;right:4%;z-index:50;display:flex;justify-content:space-between;gap:12px;pointer-events:none}.legacy-toolbar a{pointer-events:auto;display:inline-flex;align-items:center;min-height:44px;padding:10px 16px;background:#f8f9f4eb;border:1px solid #8b98aa;color:#26394d;text-decoration:none;font-size:12px}.legacy-loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#fff;padding:80px 24px}.legacy-logo{width:min(45vmin,380px);height:auto;margin:0 auto 28px;display:block}.legacy-loading progress{width:min(42vmin,355px);height:9px;accent-color:#373737}.legacy-loading p{font-size:13px;line-height:1.8}.legacy-fallback{position:fixed;inset:0;background:#f1f3f5;display:grid;place-content:center;padding:90px 8vw;text-align:center}.legacy-fallback a{display:inline-flex;min-height:44px;align-items:center;color:#26394d;margin:10px;text-underline-offset:5px}.legacy-fallback h1{font-size:26px;font-weight:500}.legacy-fallback p{max-width:540px;line-height:1.9;font-size:14px}.legacy-stage{position:fixed;inset:0}.legacy-canvas{width:100%;height:100%;display:block}
  </style>
</head>
<body>
  <nav class="legacy-toolbar" aria-label="随时离开开场">
    <a id="legacy-home" href="__LEGACY_HOME__">← 返回主页</a>
    <a id="legacy-skip" data-testid="legacy-skip" href="__CAMPUS_EXIT__">跳过开场 · 进入理韵 →</a>
  </nav>
  <main id="legacy-shell" data-phase="loading">
    <div class="legacy-stage"><canvas id="legacy-canvas" class="legacy-canvas" aria-label="原版天空、柱路与开门三维场景"></canvas></div>
    <section id="legacy-loading" class="legacy-loading" aria-labelledby="legacy-loading-title">
      <img class="legacy-logo" src="/Genshin/Genshin.png" alt="原神" />
      <h1 id="legacy-loading-title" class="sr-only">正在载入原版开场</h1>
      <progress id="legacy-progress" max="13" value="0" aria-label="模型加载进度"></progress>
      <p id="legacy-progress-text" role="status">正在准备原版场景 · 可随时跳过</p>
      <p class="legacy-note">本地恢复 · 非官方学习演示</p>
    </section>
    <div id="legacy-menu" class="legacy-menu" hidden>
      <img class="legacy-age-mark" src="/Genshin/Tex_0096.png" alt="原资源年龄提示" />
      <div class="legacy-controls"><button id="legacy-audio" type="button" aria-pressed="false">声音：关闭</button><button id="legacy-pause" type="button" aria-pressed="false">暂停画面</button></div>
      <button id="legacy-start" data-testid="legacy-start" class="legacy-start" type="button" hidden><span>开始旅程</span><img src="/Genshin/ClickMe.png" alt="" /></button>
      <button id="legacy-enter" data-testid="legacy-enter" class="legacy-enter" type="button" hidden><img src="/Genshin/Entry.png" alt="点击进入" /><span class="sr-only">进入理韵寻踪</span></button>
      <p id="legacy-live" class="legacy-live" aria-live="polite"></p>
      <details id="legacy-notice" class="legacy-notice"><summary>非官方演示 · 资源说明</summary><p>保留原项目的模型、天空、音乐与开门效果，仅用于本地学习演示。与《原神》及其权利方无关联。上游 xviewer 伴随许可证缺失，游戏资产的公开再分发权利尚待核验；不代表已获得发布授权。本入口不自动播放声音、不加载第三方统计。</p></details>
    </div>
    <section id="legacy-fallback" class="legacy-fallback" hidden aria-labelledby="legacy-fallback-title">
      <h1 id="legacy-fallback-title">原版画面暂未展开</h1>
      <p id="legacy-error" role="alert">你仍可返回主页，或直接进入理韵寻踪。</p>
      <div><button id="legacy-retry" type="button">重新载入</button><a id="legacy-fallback-exit" href="__CAMPUS_EXIT__">直接进入理韵 →</a></div>
    </section>
  </main>
  <script>
    (function(){
      var local=['localhost','127.0.0.1','[::1]'].indexOf(location.hostname.toLowerCase())!==-1;
      var target=local?'http://127.0.0.1:5174/':'__CAMPUS_EXIT__';
      try{var raw=typeof window.__EXIT_URL__==='string'?window.__EXIT_URL__.trim():'';if(raw.toLowerCase().indexOf('http://')===0||raw.toLowerCase().indexOf('https://')===0){var u=new URL(raw);if((u.protocol==='http:'||u.protocol==='https:')&&!u.username&&!u.password&&(!local||['localhost','127.0.0.1','[::1]'].indexOf(u.hostname.toLowerCase())!==-1))target=u.href;}}catch(_){}
      document.getElementById('legacy-skip').href=target;document.getElementById('legacy-fallback-exit').href=target;
      if(local)document.getElementById('legacy-home').href='http://127.0.0.1:8899/';
      var q=new URLSearchParams(location.search);if((q.has('skip')&&q.get('skip')!=='0')||location.hash.toLowerCase()==='#skip')location.assign(target);
      setTimeout(function(){var shell=document.getElementById('legacy-shell');if(!shell.hasAttribute('data-mounted')){shell.dataset.phase='fallback';document.getElementById('legacy-loading').hidden=true;document.getElementById('legacy-fallback').hidden=false;document.getElementById('legacy-error').textContent='开场脚本未能载入。上方返回与跳过入口仍可使用。';}},45000);
    })();
  </script>
  <noscript><style>#legacy-shell{display:none}</style><main class="legacy-fallback"><h1>需要 JavaScript 才能播放三维开场</h1><p>你仍可返回主页，或直接进入理韵寻踪。</p><div><a href="__LEGACY_HOME__">返回主页</a><a href="__CAMPUS_EXIT__">进入理韵寻踪 →</a></div></main></noscript>
  <script type="module" src="/src/legacy/main.ts"></script>
</body>
</html>
