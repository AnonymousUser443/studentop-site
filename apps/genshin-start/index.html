<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#eeeee2" />
  <meta name="description" content="理韵 · 纸境入场。沿晨光中的步道走近北理工校园意象：文博柱廊、青玉树影与纸山。原创艺术化三维场景，非实际校园总平面。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='6' fill='%23315e4e'/%3E%3Cpath d='M12 19h40M16 19v29M26 19v29M38 19v29M48 19v29M10 49h44' fill='none' stroke='%23f0e4c4' stroke-width='3'/%3E%3C/svg%3E" />
  <title>理韵 · 纸境入场</title>
  <!-- Optional pre-injected window.__EXIT_URL__: absolute http(s), no credentials.
       Local pages accept loopback destinations only; production default stays unchanged. -->
  <style>
    html,body{margin:0;background:#eeeee2;color:#315c4d;font-family:'Noto Sans SC','HarmonyOS Sans SC',sans-serif}
    #campus-skip{position:fixed;z-index:50;right:4.5%;top:28px;min-height:44px;display:inline-flex;align-items:center;gap:18px;box-sizing:border-box;padding:10px 19px;border:1px solid #6e8c7866;background:#f4f1e4;color:#315c4d;text-decoration:none;font-size:12px;letter-spacing:.07em}
    #campus-skip:focus-visible{outline:3px solid #936d2d;outline-offset:5px}
    .boot-screen{min-height:100svh;display:grid;place-content:center;padding:8vw;box-sizing:border-box;background:#e7eadc url('/campus-fallback.svg') center/cover;text-align:center}
    .boot-paper{background:#f4f0e6e8;border:1px solid #abbba1;padding:32px;max-width:420px}
    .boot-paper h1{font-family:'Noto Serif SC',serif;font-weight:500;letter-spacing:.2em;font-size:36px}
    .boot-paper p{font-size:13px;line-height:2}.boot-paper a{color:#315e4e;text-underline-offset:5px}
  </style>
</head>
<body>
  <a id="campus-skip" data-testid="campus-skip" href="__CAMPUS_EXIT__"><span>跳过开场<span class="skip-wide"> · 进入理韵</span></span><span aria-hidden="true">↗</span></a>
  <div id="root"><div class="boot-screen"><div class="boot-paper"><h1>循光入境</h1><p id="boot-status">晨光正在铺开。<br />你也可以随时从右上角直接进入理韵。</p></div></div></div>
  <script>
    (function () {
      var local = ['localhost','127.0.0.1','[::1]'].indexOf(location.hostname.toLowerCase()) !== -1;
      var fallback = local ? 'http://127.0.0.1:5174/' : '__CAMPUS_EXIT__';
      var target = fallback;
      try {
        var raw = typeof window.__EXIT_URL__ === 'string' ? window.__EXIT_URL__.trim() : '';
        if (raw.toLowerCase().indexOf('http://') === 0 || raw.toLowerCase().indexOf('https://') === 0) {
          var parsed = new URL(raw);
          if ((parsed.protocol === 'http:' || parsed.protocol === 'https:') && !parsed.username && !parsed.password && (!local || ['localhost','127.0.0.1','[::1]'].indexOf(parsed.hostname.toLowerCase()) !== -1)) target = parsed.href;
        }
      } catch (_) {}
      document.getElementById('campus-skip').href = target;
      var query = new URLSearchParams(location.search);
      if ((query.has('skip') && query.get('skip') !== '0') || location.hash.toLowerCase() === '#skip') location.assign(target);
      window.setTimeout(function () {
        var root = document.getElementById('root');
        var message = document.getElementById('boot-status');
        if (root && !root.hasAttribute('data-app-ready') && message) message.textContent = '开场未能加载。右上角的入口仍可带你进入理韵。';
      }, 12000);
    })();
  </script>
  <noscript>
    <style>#root{display:none}</style>
    <main class="boot-screen"><div class="boot-paper"><h1>循光入境</h1><p>当前未启用 JavaScript，三维开场已跳过。<br />你仍可直接开始探索。</p><p><a href="__CAMPUS_EXIT__">进入理韵寻踪 →</a></p></div></main>
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
