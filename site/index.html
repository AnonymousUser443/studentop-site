<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-wall="chenyu" data-align="center">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aiden 的个人主页 · 青玉纸境</title>
  <meta name="description" content="一个伪装成 Windows 11 桌面的个人主页：关于我、项目、技能、联系方式，全都藏在桌面图标和开始菜单里。" />
  <meta name="author" content="Aiden" />
  <meta name="theme-color" content="#28776b" />
  <meta name="color-scheme" content="light dark" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Aiden 的个人主页 · 青玉纸境" />
  <meta property="og:description" content="双击桌面图标，打开我的数字客厅。" />
  <meta property="og:image" content="https://studentop.cn:14355/assets/img/og-cover.jpg" />
  <meta property="og:url" content="https://studentop.cn:14355/" />
  <link rel="canonical" href="https://studentop.cn:14355/" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="preload" as="image" href="assets/img/wall-chenyu.webp" />
  <link rel="stylesheet" href="assets/css/tokens.css" />
  <link rel="stylesheet" href="assets/css/shell.css" />
  <link rel="stylesheet" href="assets/css/apps.css" />
  <link rel="stylesheet" href="assets/css/paper.css" />
  <link rel="stylesheet" href="assets/css/boot-lock.css" />
  <link rel="stylesheet" href="assets/css/update.css" />
  <link rel="preload" as="image" href="assets/img/aidenos-landscape.webp" />
</head>
<body class="is-locked">
  <!-- Server-authorized gate. The startup sequence never grants authorization. -->
  <div class="lock-screen desktop-gate" id="lockScreen" role="dialog" aria-modal="true" aria-label="Aiden 的桌面登录" tabindex="-1" data-gate-view="pending">
    <div class="lock-wall" id="lockWall" aria-hidden="true"></div>
    <div class="gate-pending" id="gatePending" role="status">正在准备登录界面…</div>

    <section class="gate-boot" id="gateBoot" aria-label="网页启动演示" hidden>
      <div class="gate-bios" id="gateBios" aria-hidden="true"></div>
      <div class="gate-logo-stage" id="gateLogoStage" aria-hidden="true">
        <div class="gate-art gate-art-moon"><img src="assets/img/aidenos-landscape.webp" alt="" width="1672" height="941" draggable="false"></div>
        <div class="gate-art gate-art-mountains"><img src="assets/img/aidenos-landscape.webp" alt="" width="1672" height="941" draggable="false"></div>
        <div class="gate-art gate-art-reflection"><img src="assets/img/aidenos-landscape.webp" alt="" width="1672" height="941" draggable="false"></div>
      </div>
      <canvas class="gate-boot-particles" id="gateBootParticles" aria-hidden="true"></canvas>
      <div class="gate-wordmark" id="gateWordmark" aria-label="AidenOS"><span data-boot-word="aiden">Aiden</span><span data-boot-word="os">OS</span></div>
      <p class="gate-boot-tagline">山水在侧，想法在手。</p>
      <button type="button" class="gate-loader" id="gateLoader" aria-label="正在启动 AidenOS，点击前往锁屏">
        <svg class="gate-loader-ring" viewBox="0 0 52 52" aria-hidden="true"><defs><linearGradient id="gateLoaderGradient"><stop stop-color="#8cc9ad"/><stop offset="1" stop-color="#f6e9c9"/></linearGradient></defs><circle class="gate-loader-track" cx="26" cy="26" r="21"/><circle class="gate-loader-arc" cx="26" cy="26" r="21"/></svg>
        <span>Starting AidenOS<span class="gate-loader-dots">...</span></span>
      </button>
      <button type="button" class="gate-skip" id="gateSkip">跳过开场 <span>Esc</span></button>
    </section>

    <section class="gate-clock-view" id="gateClockView" aria-label="锁屏时钟" hidden>
      <div class="lock-inner">
        <div class="lock-clock" id="lockClock">--:--</div>
        <div class="lock-date-row"><span class="lock-date" id="lockDate"></span><span class="lock-weekday" id="lockWeekday"></span></div>
      </div>
      <div class="gate-clock-bottom">
        <div class="gate-user" hidden><span class="avatar" id="lockAvatar">A</span><span id="lockUser">Aiden</span></div>
        <div class="gate-login-action" id="lockTip"><button type="button" class="gate-login" id="gateLogin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 15 7-7 7 7"/></svg><span>向上滑动以登录</span></button><span class="gate-key-hint">或按 Enter</span></div>
        <p class="gate-connection" id="gateClockStatus" role="status" aria-live="polite">正在确认服务状态…</p>
        <button type="button" class="gate-text-button gate-clock-retry" id="gateClockRetry" hidden>重新连接</button>
      </div>
      <button type="button" class="gate-replay" id="gateReplay">重播开场</button>
    </section>

    <section class="gate-question-view" id="gateQuestionView" aria-label="登录桌面" hidden>
      <button type="button" class="gate-back" id="gateBack"><span aria-hidden="true">←</span> 返回锁屏</button>
      <form class="gate-card" id="gateForm" autocomplete="off">
        <div class="gate-form-user"><span class="avatar lg" id="gateFormAvatar">A</span><h1>Aiden</h1></div>
        <label class="gate-question-label" for="gateAnswer">这个网站的主人的全名是？</label>
        <div class="gate-input-wrap"><input id="gateAnswer" type="text" inputmode="text" placeholder="输入答案" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="120" enterkeyhint="go" aria-describedby="gateInputNote gateStatus gateAttempts" required><button type="button" class="gate-reveal" id="gateReveal" aria-label="清除输入" aria-controls="gateAnswer" title="清除输入">×</button><button type="submit" class="gate-submit" id="gateSubmit" aria-label="验证并进入" title="验证并进入" disabled>→</button></div>
        <p class="gate-input-note" id="gateInputNote">输入答案后按 Enter，或点箭头进入。</p>
        <div class="gate-status-box" aria-live="polite" aria-atomic="true"><p class="gate-status" id="gateStatus">正在确认服务状态…</p><p class="gate-attempts" id="gateAttempts"></p></div>
        <p class="gate-countdown" id="gateCountdown" hidden></p>
        <button type="button" class="gate-text-button" id="gateRetry" hidden>重新检查服务状态</button>
      </form>
    </section>
  </div>
  <canvas class="gate-transition-particles" id="gateUnlockParticles" aria-hidden="true" hidden></canvas>

  <!-- ============ 桌面 ============ -->
  <div class="desktop" id="desktop" inert aria-hidden="true">
    <div class="wallpaper" id="wallpaper" aria-hidden="true"></div>
    <div class="desktop-signature" aria-hidden="true">
      <span class="signature-kicker">AIDEN / DIGITAL DESKTOP</span>
      <span class="signature-title">山水在侧，想法在手。</span>
      <span class="signature-foot"><span class="paper-seal">青玉</span> 纸境 · 数字案头</span>
    </div>

    <!-- 桌面图标 -->
    <div class="desktop-icons" id="desktopIcons" aria-label="桌面图标"></div>

    <!-- 窗口层 -->
    <div class="window-layer" id="windowLayer"></div>

    <!-- 贴边预览 -->
    <div class="snap-preview" id="snapPreview" aria-hidden="true"></div>

    <!-- 任务栏 -->
    <div class="taskbar" id="taskbar" data-align="center" role="toolbar" aria-label="任务栏">
      <div class="tb-left" id="tbLeft"></div>
      <div class="tb-center" id="tbCenter"></div>
      <div class="tb-right" id="tbRight">
        <button class="tray-btn" id="trayTray" aria-label="系统托盘" title="系统托盘">
          <span id="trayIcons"></span>
        </button>
        <button class="tray-clock" id="trayClock" aria-label="日期和时间" title="日期和时间">
          <span class="t-time" id="clockTime">--:--</span>
          <span class="t-date" id="clockDate">----/--/--</span>
        </button>
        <button class="notif-btn" id="notifBtn" aria-label="通知中心" title="通知中心">
          <span id="notifIcon"></span>
          <span class="dot" id="notifDot"></span>
        </button>
      </div>
    </div>

    <!-- 浮出面板容器 -->
    <div id="flyoutHost"></div>

    <!-- 通知横幅 -->
    <div class="toast-host" id="toastHost" aria-live="polite"></div>

    <!-- 右键菜单容器 -->
    <div id="ctxHost"></div>
  </div>

  <noscript>
    <div class="noscript-box">
      <div>
        <h1 style="font-size:20px;margin:0 0 8px">Aiden 的个人主页</h1>
        <p style="margin:0;opacity:.75">这个页面是一个仿 Windows 11 桌面的交互式主页，需要启用 JavaScript 才能打开窗口。</p>
        <p style="margin:12px 0 16px;opacity:.8">也可以直接翻阅项目，或写封邮件给我。</p>
        <nav class="noscript-links" aria-label="静态内容入口">
          <a href="projects/">翻阅项目</a>
          <a href="mailto:aiden@studentop.cn">写封邮件</a>
        </nav>
      </div>
    </div>
  </noscript>

  <!-- 图标库 -->
  <script src="assets/js/icons.js"></script>
  <!-- 站点内容（改这里 = 改主页） -->
  <script src="assets/js/content.js"></script>
  <!-- 内核 -->
  <script src="assets/js/core.js"></script>
  <script src="assets/js/gate-effects.js"></script>
  <script src="assets/js/boot-lock.js"></script>
  <!-- 窗口管理器 -->
  <script src="assets/js/wm.js"></script>
  <!-- 外壳：任务栏 / 开始菜单 / 面板 / 桌面 -->
  <script src="assets/js/shell.js"></script>
  <!-- 应用 -->
  <script src="assets/js/apps-about.js"></script>
  <script src="assets/js/apps-system.js"></script>
  <script src="assets/js/apps-task-manager.js"></script>
  <!-- 应用注册表 + 启动 -->
  <script src="assets/js/apps.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/update-check.js"></script>
</body>
</html>
